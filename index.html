<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Автонаводка</title>

<style>
  @font-face {
    font-family: "DW";
    src: url("dW.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    background: #000;
    color: #fff;
    height: 100dvh;
    max-height: 100dvh;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
    font-family: "DW", system-ui, sans-serif;
    touch-action: manipulation;
  }

  .app {
    position: relative;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    padding: 6px 12px calc(8px + env(safe-area-inset-bottom)) 12px;
    padding-top: calc(6px + env(safe-area-inset-top));
    gap: 4px;
    overflow: hidden;
  }

  .top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
  }

  .top-banner {
    max-width: 260px;
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  .title {
    text-align: center;
    font-family: "DW", sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1;
    margin-top: 2px;
  }
  .subtitle {
    text-align: center;
    color: #4a90e2;
    font-family: "DW", sans-serif;
    font-size: 13px;
    letter-spacing: 10px;
    line-height: 1;
    margin-left: 10px;
  }

  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transform: translateZ(0);
    margin-bottom: 14px;
  }

  .stage img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
    filter: drop-shadow(0 0 20px rgba(74,144,226,.35));
  }

  .placeholder {
    color: #2a2f3a;
    font-size: 12px;
    letter-spacing: 3px;
    border: 1px dashed #23262e;
    border-radius: 12px;
    padding: 40px 30px;
    font-family: "DW", sans-serif;
  }

  .marker {
    position: absolute;
    width: 54px;
    height: 54px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    top: 11%;
    left: 50%;
    backface-visibility: hidden;
  }

  .marker .ring {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 2px solid #4a90e2;
    background: radial-gradient(circle,
                 rgba(74,144,226,.18) 0%,
                 rgba(74,144,226,.03) 60%,
                 transparent 70%);
    box-shadow: 0 0 10px rgba(74,144,226,.55);
  }
  .marker .line { position: absolute; background: #4a90e2; box-shadow: 0 0 6px rgba(74,144,226,.7); }
  .marker .line.t { top: -6px;    left: 50%; width: 2px; height: 10px; transform: translateX(-50%); }
  .marker .line.b { bottom: -6px; left: 50%; width: 2px; height: 10px; transform: translateX(-50%); }
  .marker .line.l { left: -6px;   top: 50%;  height: 2px; width: 10px; transform: translateY(-50%); }
  .marker .line.r { right: -6px;  top: 50%;  height: 2px; width: 10px; transform: translateY(-50%); }
  .marker .corner {
    position: absolute;
    width: 6px; height: 6px;
    border: 1.5px solid #8fc1ff;
  }
  .marker .corner.tl { top: 0;    left: 0;    border-right: none;  border-bottom: none; border-radius: 3px 0 0 0; }
  .marker .corner.tr { top: 0;    right: 0;   border-left: none;   border-bottom: none; border-radius: 0 3px 0 0; }
  .marker .corner.bl { bottom: 0; left: 0;    border-right: none;  border-top: none;    border-radius: 0 0 0 3px; }
  .marker .corner.br { bottom: 0; right: 0;   border-left: none;   border-top: none;    border-radius: 0 0 3px 0; }
  .marker .core {
    position: absolute;
    top: 50%; left: 50%;
    width: 5px; height: 5px;
    background: #d7ebff;
    border-radius: 50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 8px #4a90e2, 0 0 16px #4a90e2;
  }
  .marker .label {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    font-family: "DW", sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #d7ebff;
    background: rgba(13,26,48,.85);
    border: 1px solid #2f7fff;
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
    box-shadow: 0 0 10px rgba(47,127,255,.5);
  }

  .bottom {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 0 0 auto;
  }

  .panel {
    background: #14161b;
    border: 1px solid #23262e;
    border-radius: 14px;
    padding: 8px 10px 10px;
  }
  .panel-title {
    color: #6b7280;
    font-family: "DW", sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .part {
    background: #0b0d10;
    border: 1px solid #23262e;
    border-radius: 10px;
    padding: 6px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    cursor: pointer;
    color: #6b7280;
    font-family: "DW", sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    transition: background-color .15s, border-color .15s, color .15s;
  }

  .part .icon-box {
    width: 100%;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .part .icon {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: grayscale(1) brightness(.55);
    transition: filter .15s;
    user-select: none;
    pointer-events: none;
  }

  .part.active {
    border-color: #2f7fff;
    background: #0c1a30;
    color: #fff;
    box-shadow: 0 0 0 1px #2f7fff inset, 0 0 12px rgba(47,127,255,.3);
  }
  .part.active .icon { filter: none; }

  .start {
    width: 100%;
    background: #2563eb;
    border: none;
    border-radius: 18px;
    color: #fff;
    font-family: Arial, "Helvetica Neue", sans-serif;
    font-size: 26px;
    font-weight: 700;
    padding: 14px 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background-color .15s;
  }
  .start:hover  { background: #1d4fd8; }
  .start:active { background: #1740b5; }

  #loading {
    position: fixed;
    inset: 0;
    background: #0a0c10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    z-index: 100;
    overflow: hidden;
  }
  #loading.show { display: flex; }

  #loading .l-title {
    font-family: Arial, "Helvetica Neue", sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    text-align: center;
  }
  #loading .l-sub {
    font-family: Arial, "Helvetica Neue", sans-serif;
    font-size: 14px;
    color: #6b7280;
    text-align: center;
    max-width: 300px;
    line-height: 1.4;
    min-height: 40px;
  }

  #loading .bar-wrap {
    position: relative;
    width: 82%;
    max-width: 320px;
    height: 10px;
  }
  #loading .bar {
    position: absolute;
    inset: 0;
    background: #1e2430;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  #loading .bar-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 100%;
    background: #2563eb;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    transform-origin: left center;
    transform: scaleX(0);
  }
  #loading .bar-knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 18px;
    height: 18px;
    background: #fff;
    transform: translate(-50%, -50%) rotate(45deg);
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
    pointer-events: none;
  }

  #loading .pct {
    font-family: Arial, "Helvetica Neue", sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: #2563eb;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  #loading .pct .sign { font-size: 26px; }

  @media (max-height: 720px) {
    .title      { font-size: 24px; }
    .subtitle   { font-size: 12px; letter-spacing: 8px; margin-left: 8px; }
    .top-banner { max-width: 220px; }
    .part .icon-box { height: 34px; }
    .part       { font-size: 9px; padding: 5px 3px; }
    .start      { font-size: 22px; padding: 12px; border-radius: 16px; }
    .marker .label { font-size: 10px; }
    .stage      { margin-bottom: 10px; }
  }
  @media (max-height: 600px) {
    .title      { font-size: 20px; }
    .subtitle   { font-size: 10px; letter-spacing: 6px; margin-left: 6px; }
    .top-banner { max-width: 180px; }
    .panel-title { font-size: 10px; margin-bottom: 4px; }
    .part .icon-box { height: 28px; }
    .start      { font-size: 20px; padding: 10px; }
    .stage      { margin-bottom: 6px; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="top">
    <img class="top-banner" src="tg.png" alt="Telegram" onerror="this.style.display='none';">
    <div class="title">Автонаводка</div>
    <div class="subtitle">S O 2</div>
  </div>

  <div class="stage" id="stage">
    <img id="char" src="character.png" alt="Персонаж"
         onerror="this.style.display='none'; document.getElementById('ph').style.display='block';">
    <div class="placeholder" id="ph" style="display:none;">[ CHARACTER.PNG ]</div>

    <div class="marker" id="marker">
      <div class="ring"></div>
      <div class="line t"></div>
      <div class="line b"></div>
      <div class="line l"></div>
      <div class="line r"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="core"></div>
      <div class="label" id="markerLabel">ГОЛОВА</div>
    </div>
  </div>

  <div class="bottom">
    <div class="panel">
      <div class="panel-title">ЗОНА ПОРАЖЕНИЯ</div>
      <div class="grid" id="grid">

        <button class="part active" data-part="head">
          <div class="icon-box"><img class="icon" src="head.png" alt="" onerror="this.style.opacity=.25"></div>
          ГОЛОВА
        </button>

        <button class="part" data-part="body">
          <div class="icon-box"><img class="icon" src="body.png" alt="" onerror="this.style.opacity=.25"></div>
          ЖИВОТ
        </button>

        <button class="part" data-part="arms">
          <div class="icon-box"><img class="icon" src="arms.png" alt="" onerror="this.style.opacity=.25"></div>
          РУКИ
        </button>

        <button class="part" data-part="legs">
          <div class="icon-box"><img class="icon" src="legs.png" alt="" onerror="this.style.opacity=.25"></div>
          НОГИ
        </button>

      </div>
    </div>

    <button class="start" id="start">Старт</button>
  </div>

</div>

<div id="loading">
  <div class="l-title" id="lTitle">Запуск игры...</div>
  <div class="l-sub"   id="lSub">Инициализация модуля...</div>

  <div class="bar-wrap">
    <div class="bar"></div>
    <div class="bar-fill" id="barFill"></div>
    <div class="bar-knob" id="barKnob"></div>
  </div>

  <div class="pct" id="pct">0.0<span class="sign">%</span></div>
</div>

<script>
  /* ══════════════════════════════════════════
     МЕНЮ: ВЫБОР ЗОНЫ
     ══════════════════════════════════════════ */
  const grid        = document.getElementById('grid');
  const marker      = document.getElementById('marker');
  const markerLabel = document.getElementById('markerLabel');

  const POSITIONS = {
    head: { top: '11%', left: '50%', label: 'ГОЛОВА', size: 42 },
    body: { top: '38%', left: '50%', label: 'ЖИВОТ',  size: 54 },
    arms: { top: '44%', left: '18%', label: 'РУКИ',   size: 54 },
    legs: { top: '72%', left: '50%', label: 'НОГИ',   size: 54 }
  };

  function applyZone(key) {
    const pos = POSITIONS[key];
    if (!pos) return;
    marker.style.top    = pos.top;
    marker.style.left   = pos.left;
    marker.style.width  = pos.size + 'px';
    marker.style.height = pos.size + 'px';
    markerLabel.textContent = pos.label;
  }

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.part');
    if (!btn) return;
    grid.querySelectorAll('.part').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyZone(btn.dataset.part);
  });

  applyZone('head');

  /* ══════════════════════════════════════════
     ЗАГРУЗКА
     ══════════════════════════════════════════ */
  const STEPS = [
    { at: 0,   sub: 'Инициализация модуля...' },
    { at: 15,  sub: 'Внедрение данных и обход защиты...' },
    { at: 35,  sub: 'Синхронизация с игровым движком...' },
    { at: 55,  sub: 'Калибровка модуля наведения...' },
    { at: 75,  sub: 'Применение конфигурации и защита памяти...' },
    { at: 92,  sub: 'Финальная проверка...' },
    { at: 100, sub: 'Успешно. Запуск Standoff 2...' }
  ];

  const loading = document.getElementById('loading');
  const lTitle  = document.getElementById('lTitle');
  const lSub    = document.getElementById('lSub');
  const barFill = document.getElementById('barFill');
  const barKnob = document.getElementById('barKnob');
  const pct     = document.getElementById('pct');

  let rafId    = null;
  let lastStep = -1;

  function setProgress(value) {
    value = Math.min(100, Math.max(0, value));

    barFill.style.transform = 'scaleX(' + (value / 100) + ')';

    const wrap   = barFill.parentElement;
    const w      = wrap.clientWidth;
    const usable = w - 16;
    const knobX  = 8 + (value / 100) * usable;
    barKnob.style.transform =
      'translate(' + (knobX - 9) + 'px, -50%) rotate(45deg)';

    pct.innerHTML = value.toFixed(1) + '<span class="sign">%</span>';

    for (let i = 0; i < STEPS.length; i++) {
      if (value >= STEPS[i].at && lastStep !== i) {
        lastStep = i;
        lSub.textContent = STEPS[i].sub;
      }
    }
  }

  /* ══════════════════════════════════════════
     ЗАПУСК STANDOFF 2 (только в APK)
     ══════════════════════════════════════════ */
  const STANDOFF_PACKAGE = 'com.axlebolt.standoff2';

  function launchStandoff() {
    // Способ 1: Cordova-плагин app-launcher
    if (window.cordova && window.launcher) {
      window.launcher.canLaunch(
        { packageName: STANDOFF_PACKAGE },
        function (can) {
          if (can) {
            window.launcher.launch(
              { packageName: STANDOFF_PACKAGE },
              function () { console.log('Standoff 2 запущен'); },
              function (e) { console.warn('Ошибка запуска:', e); }
            );
          } else {
            console.warn('Standoff 2 не установлен');
            alert('Standoff 2 не установлен на устройстве');
          }
        },
        function (e) { console.warn('canLaunch error:', e); }
      );
      return;
    }

    // Способ 2 (запасной): через Android intent:// URL
    // работает в некоторых WebView, но не во всех
    try {
      const intentUrl = 'intent://launch#Intent;scheme=standoff;package=' +
                        STANDOFF_PACKAGE + ';end';
      window.location.href = intentUrl;
    } catch (e) {
      console.warn('Intent fallback failed:', e);
    }

    // Способ 3 (совсем запасной): market:// открытие страницы игры
    // setTimeout(() => {
    //   window.location.href = 'market://details?id=' + STANDOFF_PACKAGE;
    // }, 800);
  }

  function runLoading() {
    cancelAnimationFrame(rafId);
    setProgress(0);
    lastStep = -1;
    lTitle.textContent = 'Запуск игры...';
    lSub.textContent   = 'Инициализация модуля...';

    loading.classList.add('show');

    requestAnimationFrame(() => {
      const DURATION  = 7500;
      const startTime = performance.now();

      function tick(now) {
        const t   = Math.min(1, (now - startTime) / DURATION);
        const val = t * 100;
        setProgress(val);

        if (t < 1) {
          rafId = requestAnimationFrame(tick);
        } else {
          // ═══ ФИНАЛ: показываем «Готово» и через 1.4 сек запускаем Standoff 2 ═══
          lTitle.textContent = 'Готово';
          lSub.textContent   = 'Успешно. Модуль активирован.';

          setTimeout(() => {
            loading.classList.remove('show');

            // 🚀 ЗАПУСК STANDOFF 2
            launchStandoff();
          }, 1400);
        }
      }

      rafId = requestAnimationFrame(tick);
    });
  }

  document.getElementById('start').addEventListener('click', () => {
    const active = grid.querySelector('.part.active');
    console.log('Зона:', active.dataset.part);
    runLoading();
  });

  /* ══════════════════════════════════════════
     Блокировка скролла и зума
     ══════════════════════════════════════════ */
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
  }, { passive: false });
</script>

</body>
</html>
