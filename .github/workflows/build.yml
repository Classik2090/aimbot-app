name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.bucheat.aimbot Aimbot
          cd app
          rm -rf www/*
          cp -r ../index.html www/ 2>/dev/null || true
          cp -r ../*.png www/ 2>/dev/null || true
          cp -r ../*.ttf www/ 2>/dev/null || true

      - name: Add Android Platform
        run: |
          cd app
          cordova platform add android

      - name: Add App Launcher Plugin
        run: |
          cd app
          cordova plugin add cordova-plugin-app-launcher

      - name: Patch AndroidManifest with queries
        run: |
          cd app
          MANIFEST=platforms/android/app/src/main/AndroidManifest.xml
          # Вставляем queries с явным xmlns:android ВНУТРИ тега package
          sed -i 's|<application|<queries><package xmlns:android="http://schemas.android.com/apk/res/android" android:name="com.axlebolt.standoff2" /></queries><application|' $MANIFEST
          echo "--- Manifest after patch ---"
          grep -A2 queries $MANIFEST || echo "NO QUERIES FOUND"

      - name: Build APK
        run: |
          cd app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
