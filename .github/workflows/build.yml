name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.bucheat.aimbot Aimbot
          cd app
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/.github 2>/dev/null || true

      - name: Add Queries for Standoff 2
        run: |
          cd app
          # Заменяем <platform name="android"></platform> на блок с queries
          python3 - <<'PY'
          import re
          with open('config.xml', 'r', encoding='utf-8') as f:
              xml = f.read()

          block = '''<platform name="android">
              <config-file target="AndroidManifest.xml" parent="/manifest">
                  <queries>
                      <package android:name="com.axlebolt.standoff2" />
                  </queries>
              </config-file>
          </platform>'''

          if '<platform name="android"' in xml:
              xml = re.sub(r'<platform name="android">.*?</platform>', block, xml, flags=re.DOTALL)
          else:
              xml = xml.replace('</widget>', block + '\n</widget>')

          with open('config.xml', 'w', encoding='utf-8') as f:
              f.write(xml)
          print('--- config.xml after edit ---')
          print(xml)
          PY

      - name: Add Android Platform
        run: |
          cd app
          cordova platform add android

      - name: Add App Launcher Plugin
        run: |
          cd app
          cordova plugin add cordova-plugin-app-launcher

      - name: Build APK
        run: |
          cd app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
